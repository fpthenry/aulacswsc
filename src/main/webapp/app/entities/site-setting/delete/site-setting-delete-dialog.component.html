@if (siteSetting) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(siteSetting.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="siteSettingDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-siteSetting-heading"
        jhiTranslate="aulacswscApp.siteSetting.delete.question"
        [translateValues]="{ id: siteSetting.id }"
      >
        Are you sure you want to delete Site Setting {{ siteSetting.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="jhi-confirm-delete-siteSetting" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
